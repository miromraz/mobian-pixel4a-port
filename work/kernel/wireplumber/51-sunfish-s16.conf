# sunfish: the sec-TDM speaker link runs 16-bit slots; force the ALSA sink
# to S16 so PipeWire does not open the DSP frontend at 24-bit (inaudible).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate   = 48000
      }
    }
  }
]
