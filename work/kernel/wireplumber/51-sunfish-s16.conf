# sunfish: the sec-TDM speaker link runs 16-bit slots; force the ALSA sink
# to S16 so PipeWire does not open the DSP frontend at 24-bit (inaudible).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate   = 48000
      }
    }
  }
  # Landscape stereo: held horizontally (earpiece to the right), TDM slot 0
  # (EAR/earpiece) is the physically-RIGHT speaker and slot 1 (SPK/bottom)
  # the LEFT one. Tell PipeWire the device channel positions so FL/FR land
  # on the correct physical sides. Headphones sink stays FL,FR.
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*Speaker.*" }
    ]
    actions = {
      update-props = {
        audio.position = [ FR, FL ]
      }
    }
  }
]
