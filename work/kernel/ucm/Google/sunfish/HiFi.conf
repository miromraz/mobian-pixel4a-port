# Google Pixel 4a (sunfish) — HiFi: two independent output sinks.
#   Speaker    = MultiMedia1 (hw:,0) -> SEC_TDM -> CS35L41 amps
#   Headphones = MultiMedia2 (hw:,1) -> RX_CODEC_DMA -> RX macro ->
#                SoundWire -> WCD9375 HPHL/HPHR
# Both FE->BE mixers set in the verb so each PCM has a backend at probe.
# Requires the RX SoundWire controller + rx/va macros to be kept
# runtime-active (udev) so the SWR bus clock is up when the codec path
# prepares -- otherwise SoundWire transfers -EIO and the card drops off.

SectionVerb {
	EnableSequence [
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TERT_TDM_TX_0' 1"
	]
	DisableSequence [
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TERT_TDM_TX_0' 0"
	]
	Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
	Comment "Internal stereo speakers"
	EnableSequence [
		cset "name='EAR Digital PCM Volume' 750"
		cset "name='SPK Digital PCM Volume' 750"
	]
	DisableSequence [
		cset "name='EAR Digital PCM Volume' 0"
		cset "name='SPK Digital PCM Volume' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	EnableSequence [
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX HPH Mode' CLS_H_ULP"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 1"
		cset "name='RX_COMP2 Switch' 1"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
	]
	DisableSequence [
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphones"

	EnableSequence [
		cset "name='Stereo1 DMIC Mux' DMIC1"
		cset "name='Stereo2 DMIC Mux' DMIC2"
		cset "name='Sto1 ADC MIXL DMIC Switch' 1"
		cset "name='Sto1 ADC MIXR DMIC Switch' 1"
		cset "name='Sto2 ADC MIXL DMIC Switch' 1"
		cset "name='Sto2 ADC MIXR DMIC Switch' 1"
		cset "name='DMIC1 Switch' 1"
		cset "name='DMIC2 Switch' 1"
		cset "name='ADC1 Capture Volume' 53"
		cset "name='ADC2 Capture Volume' 53"
		cset "name='MIC Boost Volume' 2"
	]

	DisableSequence [
		cset "name='Sto1 ADC MIXL DMIC Switch' 0"
		cset "name='Sto1 ADC MIXR DMIC Switch' 0"
		cset "name='Sto2 ADC MIXL DMIC Switch' 0"
		cset "name='Sto2 ADC MIXR DMIC Switch' 0"
	]

	Value {
		CapturePriority 100
		CaptureChannels 2
		CapturePCM "hw:${CardId},2"
	}
}
