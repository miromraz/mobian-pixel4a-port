# Google Pixel 4a (sunfish) — HiFi playback
# Stereo CS35L41 amps on secondary TDM (EAR = top/earpiece = slot 0,
# SPK = bottom = slot 1). Amps run without DSP speaker protection:
# keep the fixed digital volume at a moderate level (816 = 0 dB).

SectionVerb {
	EnableSequence [
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal stereo speakers"

	EnableSequence [
		cset "name='EAR Digital PCM Volume' 750"
		cset "name='SPK Digital PCM Volume' 750"
	]

	DisableSequence [
		cset "name='EAR Digital PCM Volume' 0"
		cset "name='SPK Digital PCM Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
	}
}
