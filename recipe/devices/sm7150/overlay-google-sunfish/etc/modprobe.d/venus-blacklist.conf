# venus_core autoloads on qcom,sm7150-venus and its of_platform_populate() then creates the
# venus-decoder/venus-encoder children, so decode comes up by itself. Encode does NOT work:
# STREAMON on /dev/video11 hard-resets the SoC, so keep venus_enc off the autoload path. It is
# still loadable by hand (`modprobe venus_enc`) for encode bring-up work.
blacklist venus_enc
